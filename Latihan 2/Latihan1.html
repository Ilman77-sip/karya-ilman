<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Margin dan Padding</title>
    <style>
        .satu {
            border: 1px solid black;
            background-color: lightblue;
            /* Atas 40px, Kanan 50px, Bawah 60px, Kiri 30px */
            margin: 40px 50px 60px 30px; 
        }
        .dua {
            border: 1px solid black;
            background-color: lightblue;
            /* Padding semua sisi 40px */
            padding: 40px; 
        }
    </style>
</head>
<body>
    <div class="satu">
        Partisi ini memiliki margin atas 40px, kanan 50px, bawah 60px, dan kiri 30px.
    </div>
    <div class="dua">
        Partisi ini memiliki padding atas, kanan, bawah, dan kiri 40px.
    </div>
</body>
</html>
